	<script src="https://code.jquery.com/jquery-1.8.3.min.js"></script>
	<script>
	function bgm(el)
	{
		// $(el).preventDefault();
		const link = $(el);
		event.preventDefault();

		if ( link.is('.on') ) {
        	link.find('img').attr('src', link.find('img').attr('src').replace(/on\.gif$/, 'off.gif'));
        	link.removeClass('on');
		}
	    else {
	        link.find('img').attr('src', link.find('img').attr('src').replace(/off\.gif$/, 'on.gif'));
	        link.addClass('on');
	    }

		const frame = document.getElementById('mobile');
		const mobile = frame.contentWindow || frame.contentDocument;

		mobile.bgmControl();
	}

	function bgmButtonSet(type) {
		if ( type == 'play' )
	        $('#bgmButton').find('img').attr('src', $('#bgmButton').find('img').attr('src').replace(/off\.gif$/, 'on.gif'));
		else if ( type == 'pause' )
			$('#bgmButton').find('img').attr('src', $('#bgmButton').find('img').attr('src').replace(/on\.gif$/, 'off.gif'));
	}
	</script>
